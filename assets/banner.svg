<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#060911" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
    </pattern>

    <!-- Filter for Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.18) translate(25px, -15px); opacity: 0.65; }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes pulseDash {
        to { stroke-dashoffset: -80; }
      }
      @keyframes waveScan {
        0% { transform: translateX(-150px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(1100px); opacity: 0; }
      }
      .orb-1 {
        animation: pulseOrb 8s ease-in-out infinite alternate;
        transform-origin: 300px 180px;
      }
      .orb-2 {
        animation: pulseOrb 10s ease-in-out infinite alternate-reverse;
        transform-origin: 900px 240px;
      }
      .floating-card {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .floating-card-reverse {
        animation: floatSlow 7s ease-in-out infinite reverse;
      }
      .data-stream {
        stroke-dasharray: 8, 8;
        animation: pulseDash 2.5s linear infinite;
      }
      .scanner-beam {
        animation: waveScan 7s cubic-bezier(0.4, 0, 0.2, 1) infinite;
      }
      .tech-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      .tech-sub {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        letter-spacing: 0.2px;
      }
      .tech-pill {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Orbs -->
  <circle class="orb-1" cx="260" cy="140" r="180" fill="url(#glowGrad)" />
  <circle class="orb-2" cx="950" cy="260" r="220" fill="url(#glowGrad)" />

  <!-- Grid Overlay -->
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Background Animated Data Flows (Subtle, never overlapping center text) -->
  <g opacity="0.3">
    <path class="data-stream" d="M 50 80 Q 300 20 600 80 T 1150 80" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="data-stream" d="M 50 360 Q 400 400 700 350 T 1150 370" fill="none" stroke="#a855f7" stroke-width="2" />
  </g>

  <!-- Floating Background Ambient Cards (Low opacity, on edges) -->
  <g class="floating-card" opacity="0.45" transform="translate(60, 110)">
    <rect width="170" height="85" rx="10" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="11" font-weight="700">📈 PRICE INTEL</text>
    <text x="16" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Real-time Scraping</text>
    <text x="16" y="70" fill="#34d399" font-family="sans-serif" font-size="12" font-weight="700">▲ Buy Box 99.4%</text>
  </g>

  <g class="floating-card-reverse" opacity="0.45" transform="translate(970, 110)">
    <rect width="170" height="85" rx="10" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.2" />
    <text x="16" y="28" fill="#c084fc" font-family="sans-serif" font-size="11" font-weight="700">⚡ INVENTORY SYNC</text>
    <text x="16" y="52" fill="#94a3b8" font-family="sans-serif" font-size="10">Multi-Channel Routing</text>
    <text x="16" y="70" fill="#38bdf8" font-family="sans-serif" font-size="12" font-weight="700">✓ 950+ Channels</text>
  </g>

  <!-- Laser Scanner Pulse Effect in background -->
  <line class="scanner-beam" x1="0" y1="50" x2="0" y2="370" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.4" />

  <!-- Foreground Container (Clear, Prominent, Unobstructed) -->
  <g id="foreground-content">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(600, 75)">
      <rect x="-165" y="-14" width="330" height="28" rx="14" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.2" />
      <text class="tech-pill" text-anchor="middle" y="5" fill="#a5b4fc">🛍️ CURATED KNOWLEDGE &amp; TOOLKIT</text>
    </g>

    <!-- Main Title -->
    <text class="tech-title" x="600" y="150" text-anchor="middle" font-size="44" fill="url(#primaryGrad)" filter="url(#glow)">
      Awesome E-Commerce Intelligence
    </text>
    <text class="tech-title" x="600" y="150" text-anchor="middle" font-size="44" fill="url(#primaryGrad)">
      Awesome E-Commerce Intelligence
    </text>

    <!-- Second Line of Title -->
    <text class="tech-title" x="600" y="202" text-anchor="middle" font-size="36" fill="#f8fafc">
      &amp; Inventory Automation
    </text>

    <!-- Subtitle / Mission Statement -->
    <text class="tech-sub" x="600" y="246" text-anchor="middle" font-size="16" fill="#cbd5e1">
      Top SaaS Platforms &amp; Open-Source Projects for Multi-Channel Retail Engineering
    </text>

    <text class="tech-sub" x="600" y="272" text-anchor="middle" font-size="13.5" fill="#94a3b8">
      Price Monitoring • Demand Forecasting • Automated Repricing • Feed Syndication • WMS/ERP Sync
    </text>

    <!-- Bottom Feature Pills / Badges in Foreground -->
    <g transform="translate(600, 335)">
      <!-- Pill 1 -->
      <g transform="translate(-340, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text class="tech-pill" x="75" y="20" text-anchor="middle" fill="#7dd3fc">🏷️ Price Tracking</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(-170, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text class="tech-pill" x="80" y="20" text-anchor="middle" fill="#c7d2fe">📦 Inventory &amp; WMS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(10, 0)">
        <rect x="0" y="0" width="160" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text class="tech-pill" x="80" y="20" text-anchor="middle" fill="#e9d5ff">📊 Market Analytics</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(190, 0)">
        <rect x="0" y="0" width="150" height="32" rx="16" fill="#0f172a" stroke="#ec4899" stroke-width="1.2" />
        <text class="tech-pill" x="75" y="20" text-anchor="middle" fill="#fbcfe8">🤖 Workflow Auto</text>
      </g>
    </g>
  </g>

  <!-- Border Accent Outline -->
  <rect x="1" y="1" width="1198" height="418" rx="12" fill="none" stroke="#334155" stroke-width="1.5" stroke-opacity="0.6" />
</svg>
